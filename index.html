<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="B&T Power">
<title>Blood & Turbo Power</title>
<style>
:root{--bg:#0a0a10;--bg2:#12121e;--bg3:#1a1a28;--border:#252535;--text:#e0e0ee;--text2:#888899;--accent:#e94560;--gold:#f5a623;--green:#4ade80;--red:#f87171;--blue:#4a9eff;--purple:#c084fc;--r:12px;--rs:8px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;overscroll-behavior:none;}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;}
.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;}
.ht{font-size:17px;font-weight:900;letter-spacing:2px;color:var(--accent);}
.hs{font-size:10px;color:var(--text2);margin-top:1px;}
.nav{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.nb{flex:1;padding:10px 1px 8px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text2);font-size:8px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;}
.nb.active{border-bottom-color:var(--accent);color:var(--accent);}
.ni{font-size:16px;}
.pg{display:none;overflow-y:auto;padding:14px;padding-bottom:40px;}
.pg.active{display:block;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;}
.ct{font-size:10px;font-weight:700;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px;}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
.db{flex:0 0 auto;padding:8px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:25px;color:var(--text2);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
/* FORCE */
.fb{border-radius:var(--r);padding:14px;margin-bottom:10px;border:1px solid;background:linear-gradient(135deg,#1a0810,var(--bg));}
.fb-tag{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;}
.fb-mv{font-size:18px;font-weight:900;color:#fff;margin-bottom:12px;}
.series-block{background:var(--bg3);border-radius:var(--rs);padding:12px;margin-bottom:10px;}
.srow{display:grid;grid-template-columns:80px 1fr 80px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
.srow:last-child{border-bottom:none;}
.slabel{font-size:12px;font-weight:700;}
.sdesc{font-size:11px;color:var(--text2);}
.skg{font-size:15px;font-weight:700;text-align:right;}
.cluster-box{background:rgba(245,166,35,0.08);border:1px solid rgba(245,166,35,0.25);border-radius:var(--rs);padding:9px 11px;font-size:11px;color:var(--gold);line-height:1.6;margin-bottom:8px;}
.note-box{background:rgba(233,69,96,0.08);border:1px solid rgba(233,69,96,0.25);border-radius:var(--rs);padding:9px 11px;font-size:11px;color:var(--accent);line-height:1.5;}
/* HYP */
.hyp{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:10px;}
.hyp-title{font-size:10px;font-weight:700;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;}
.ss-label{font-size:10px;font-weight:700;color:var(--text2);letter-spacing:1px;margin-bottom:8px;margin-top:4px;}
.ex-row{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);}
.ex-row:last-child{border-bottom:none;}
.ex-left{flex:1;}
.ex-id{font-size:10px;font-weight:700;color:var(--text2);margin-bottom:1px;}
.ex-name{font-size:13px;font-weight:600;margin-bottom:2px;}
.ex-detail{font-size:11px;color:var(--text2);line-height:1.4;}
.ex-right{text-align:right;flex-shrink:0;margin-left:10px;}
.ex-sets{font-size:13px;font-weight:700;}
.ex-reps{font-size:10px;color:var(--text2);}
.mbadge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:9px;font-weight:700;margin-top:4px;}
.m-rp{background:rgba(74,222,128,0.15);color:var(--green);}
.m-drp{background:rgba(255,107,157,0.15);color:#ff6b9d;}
.m-myo{background:rgba(192,132,252,0.15);color:var(--purple);}
.m-cluster{background:rgba(245,166,35,0.15);color:var(--gold);}
.ib{background:var(--bg3);border-radius:var(--rs);padding:11px;font-size:11px;color:var(--text2);line-height:1.6;margin-bottom:10px;}
/* TOP SET */
.mv-sel{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.mv-btn{flex:1;min-width:60px;padding:9px 4px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text2);font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;}
.ts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.tf label{font-size:9px;color:var(--text2);display:block;text-align:center;margin-bottom:3px;}
.tf input,.tf select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:11px 5px;color:var(--text);font-size:16px;text-align:center;width:100%;font-family:inherit;}
.btn-calc{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:12px;}
.result-box{border-radius:var(--r);padding:14px;text-align:center;border:1px solid;margin-bottom:12px;}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.hist-row:last-child{border-bottom:none;}
.badge-up{background:rgba(74,222,128,0.15);color:var(--green);padding:2px 8px;border-radius:20px;font-size:11px;}
.badge-dn{background:rgba(248,113,113,0.15);color:var(--red);padding:2px 8px;border-radius:20px;font-size:11px;}
.btn-del{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:2px 5px;}
.chart-wrap{width:100%;height:160px;position:relative;margin:8px 0;}
.btn-s{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:7px;}
.rm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:7px;}
.rmf label{font-size:9px;color:var(--text2);display:block;text-align:center;margin-bottom:3px;}
.rmf input{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:9px 5px;color:var(--text);font-size:15px;text-align:center;width:100%;font-family:inherit;}
.btn-p{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:8px;}
.btn-g{width:100%;padding:13px;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 20px;border-radius:25px;font-size:13px;font-weight:600;opacity:0;transition:opacity 0.25s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="hdr">
  <div><div class="ht">BLOOD &amp; TURBO POWER</div><div class="hs">UPPER LOWER · FORCE + HYPERTROPHIE · COMPET. 1ER SEPT.</div></div>
</div>
<nav class="nav">
  <button class="nb active" onclick="SP('prog')" id="nav-prog"><span class="ni">💪</span><span>Programme</span></button>
  <button class="nb" onclick="SP('topset')" id="nav-topset"><span class="ni">🎯</span><span>Top Set</span></button>
  <button class="nb" onclick="SP('info')" id="nav-info"><span class="ni">📋</span><span>Progression</span></button>
  <button class="nb" onclick="SP('backup')" id="nav-backup"><span class="ni">💾</span><span>Backup</span></button>
</nav>
<div class="pg active" id="pg-prog"></div>
<div class="pg" id="pg-topset"></div>
<div class="pg" id="pg-info"></div>
<div class="pg" id="pg-backup"></div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
var RM = JSON.parse(localStorage.getItem('btp_rm6')||'null')||{bench:100,squat:110,sdt:145,ohp:55};
var TS = JSON.parse(localStorage.getItem('btp_ts6')||'[]');
var curMv = 'sdt';
var perfChart = null;
var cd = 0;

function svRM(){localStorage.setItem('btp_rm6',JSON.stringify(RM));}
function svTS(){localStorage.setItem('btp_ts6',JSON.stringify(TS));}
function ldCD(){try{var r=localStorage.getItem('btp_cd6');if(r)cd=parseInt(r);}catch(e){}}
function svCD(){localStorage.setItem('btp_cd6',String(cd));}

var MV_LABELS={bench:'BENCH',squat:'SQUAT',sdt:'SDT',ohp:'MILITAIRE'};
var MV_COLORS={bench:'#f5a623',squat:'#7bed9f',sdt:'#00b4d8',ohp:'#e94560'};
var RPE_F={10:1,9.5:1.022,9:1.044,8.5:1.067,8:1.091,7.5:1.116,7:1.143,6.5:1.171,6:1.2,5:1.25};

function calc1RM(c,r,rpe){return Math.round(c*(1+r/30)*(RPE_F[parseFloat(rpe)]||1));}
function kgFrom(rm,pct){return Math.round(rm*pct/100/2.5)*2.5;}
function today(){return new Date().toISOString().split('T')[0];}
function fd(s){return new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}

var DAYS = [
  {
    id:0, short:"UPPER 1", label:"UPPER 1 — BENCH", accent:"#e94560",
    force:{mv:"BENCH BARRE", rm:"bench",
      note:"Prise competition. Toucher poitrine. Pieds au sol."},
    supersets:[
      {label:"SUPERSET 1B + 1C",exs:[
        {id:"1B",n:"Chin-Up",        d:"Max reps BW · RIR 1-2",              sets:"2", reps:"max"},
        {id:"1C",n:"Band Pull Apart",d:"15-20 reps · tension constante",     sets:"2", reps:"15-20"},
      ]},
      {label:"SUPERSET 2A + 2B",exs:[
        {id:"2A",n:"DB Incline Press",      d:"8-10 reps · 15° · amplitude complete",sets:"2",reps:"8-10"},
        {id:"2B",n:"Wide Grip Pull-Down",   d:"8-10 reps · tirage large",           sets:"2",reps:"8-10"},
      ]},
      {label:"SUPERSET 3A + 3B",exs:[
        {id:"3A",n:"Weighted Dips",         d:"8-10 reps · lestes · amplitude complete",sets:"2",reps:"8-10"},
        {id:"3B",n:"Curl incline halteres", d:"8-10 reps/bras · Double Contraction",   sets:"3",reps:"8-10",arm:true},
      ]},
      {label:"SUPERSET 4A + 4B + 4C",exs:[
        {id:"4A",n:"DB Rear Raise",      d:"12-15 reps · deltoide posterieur",sets:"2",reps:"12-15"},
        {id:"4B",n:"DB Lateral Raise",   d:"10-15 reps · deltoide moyen",    sets:"2",reps:"10-15"},
        {id:"4C",n:"Elev. lat. poulie basse",d:"10-15 reps/bras",            sets:"2",reps:"10-15"},
      ]},
    ]
  },
  {
    id:1, short:"UPPER 2", label:"UPPER 2 — MILITAIRE", accent:"#f5a623",
    force:{mv:"MILITAIRE ASSIS BARRE", rm:"ohp",
      note:"Assis strict. Gainage. Barre au menton."},
    supersets:[
      {label:"SUPERSET 1B + 1C",exs:[
        {id:"1B",n:"Chin-Up",        d:"Max reps BW · RIR 1-2",         sets:"2",reps:"max"},
        {id:"1C",n:"Band Pull Apart",d:"15-20 reps",                    sets:"2",reps:"15-20"},
      ]},
      {label:"SUPERSET 2A + 2B",exs:[
        {id:"2A",n:"Bench Pause Barre",          d:"6-8 reps · pause 1-2s poitrine · prise competition",sets:"2",reps:"6-8"},
        {id:"2B",n:"Tirage horizontal poulie basse",d:"8-15 reps · 2 bras · pause 1s en haut",         sets:"2",reps:"8-15"},
      ]},
      {label:"SUPERSET 3A + 3B — BRAS · 3 series",exs:[
        {id:"3A",n:"Cable Extension",d:"8-12 reps · triceps isolation",sets:"3",reps:"8-12",arm:true},
        {id:"3B",n:"Cable Curl",     d:"8-10 reps · biceps isolation", sets:"3",reps:"8-10",arm:true},
      ]},
      {label:"SUPERSET 4A + 4B — Myo Reps derniere serie",exs:[
        {id:"4A",n:"Reverse Pec Deck",        d:"10-15 reps · deltoide posterieur",sets:"2",reps:"10-15",myo:true},
        {id:"4B",n:"Elev. lat. poulie basse", d:"10-15 reps/bras",                 sets:"2",reps:"10-15",myo:true},
      ]},
    ]
  },
  {
    id:2, short:"LOWER 1", label:"LOWER 1 — SQUAT", accent:"#7bed9f",
    force:{mv:"SQUAT BARRE HAUTE", rm:"squat",
      note:"Profondeur competition. Touch & go sur reps volume."},
    supersets:[
      {label:"1B — MOLLETS",exs:[
        {id:"1B",n:"Tibialis Raises",d:"15-30 reps · contre mur",sets:"2",reps:"15-30"},
      ]},
      {label:"SUPERSET 2A + 2B",exs:[
        {id:"2A",n:"Fentes bulgares halteres",d:"8-10 reps/jambe · amplitude complete",sets:"2",reps:"8-10"},
        {id:"2B",n:"Calves Raises",           d:"15-20 reps · tempo 1-1-1-1",          sets:"2",reps:"15-20"},
      ]},
      {label:"SUPERSET 3A + 3B — Rest Pause",exs:[
        {id:"3A",n:"Leg Extension",d:"10-15 reps · pause 1s en haut · Rest Pause",sets:"2",reps:"10-15",rp:true},
        {id:"3B",n:"Leg Curl",     d:"8-10 reps · excentrique 3s · Rest Pause",   sets:"2",reps:"8-10",rp:true},
      ]},
      {label:"SUPERSET 4A + 4B — ABDOS",exs:[
        {id:"4A",n:"Back Extension leste",d:"10-15 reps · charge sur poitrine",sets:"2",reps:"10-15"},
        {id:"4B",n:"Ab wheel",            d:"Max reps · genoux au sol",          sets:"4",reps:"max"},
      ]},
    ]
  },
  {
    id:3, short:"LOWER 2", label:"LOWER 2 — SDT", accent:"#00b4d8",
    force:{mv:"SDT CONVENTIONNEL", rm:"sdt",
      note:"Dos neutre. Sangles. Touch & go sur reps volume."},
    supersets:[
      {label:"1B — MOLLETS",exs:[
        {id:"1B",n:"DB Calves Raises",d:"15-20 reps/jambe · tempo 1-1-1-1",sets:"2",reps:"15-20"},
      ]},
      {label:"SUPERSET 2A + 2B — Rest Pause sur Cyclist",exs:[
        {id:"2A",n:"Cyclist Squat",       d:"5-8 reps · talons sureleves · quad pur · Rest Pause",sets:"2",reps:"5-8",rp:true},
        {id:"2B",n:"Seated Calves Raises",d:"15-20 reps · tempo 1-1-1-1",                         sets:"2",reps:"15-20"},
      ]},
      {label:"SUPERSET 3A + 3B — DOS HAUT",exs:[
        {id:"3A",n:"BB Shrug",                    d:"5 reps lourd · pause 1s en haut",     sets:"2",reps:"5"},
        {id:"3B",n:"Rowing Hammer focus trapezes",d:"8-10 reps · pause 1s en haut",        sets:"2",reps:"8-10"},
      ]},
      {label:"SUPERSET 4A + 4B — ABDOS",exs:[
        {id:"4A",n:"Back Extension dos arrondi",d:"15-20 reps · lombaires",sets:"2",reps:"15-20"},
        {id:"4B",n:"Toes to Bar",               d:"Max reps BW",           sets:"4",reps:"max"},
      ]},
    ]
  },
];

function SP(p){
  document.querySelectorAll('.pg').forEach(function(x){x.classList.remove('active');});
  document.querySelectorAll('.nb').forEach(function(x){x.classList.remove('active');});
  document.getElementById('pg-'+p).classList.add('active');
  document.getElementById('nav-'+p).classList.add('active');
  if(p==='prog')renderProg();
  if(p==='topset')renderTS();
  if(p==='info')renderInfo();
  if(p==='backup')renderBackup();
}

function selDay(i){cd=i;svCD();renderProg();}

function renderProg(){
  var el=document.getElementById('pg-prog');
  var day=DAYS[cd];
  var rm=day.force.rm?RM[day.force.rm]:null;
  var topKg=rm?kgFrom(rm,78):null;
  var bo1Kg=topKg?(topKg-5):null;
  var bo2Kg=topKg?(topKg-10):null;

  var html='<div class="days">'
    +DAYS.map(function(d,i){
      return '<button class="db" onclick="selDay('+i+')" style="'+(i===cd?'background:'+d.accent+';border-color:'+d.accent+';color:#000':'')+'">'+d.short+'</button>';
    }).join('')+'</div>';

  // FORCE
  html+='<div class="fb" style="border-color:'+day.accent+'">'
    +'<div class="fb-tag" style="color:'+day.accent+'">BLOC FORCE — 5 REPS · ~78% 1RM</div>'
    +'<div class="fb-mv">'+day.force.mv+'</div>'
    +'<div class="series-block">'
    +'<div class="srow"><span class="slabel" style="color:'+day.accent+'">TOP SET</span>'
    +'<span class="sdesc">5 reps · +2.5 ou 5kg vs semaine precedente</span>'
    +'<span class="skg" style="color:'+day.accent+'">'+(topKg?'~'+topKg+' kg':'—')+'</span></div>'
    +'<div class="srow"><span class="slabel" style="color:var(--text2)">BACK-OFF 1</span>'
    +'<span class="sdesc">-5kg du top set · 5 reps</span>'
    +'<span class="skg" style="color:var(--text2)">'+(bo1Kg?bo1Kg+' kg':'—')+'</span></div>'
    +'<div class="srow"><span class="slabel" style="color:var(--text2)">BACK-OFF 2</span>'
    +'<span class="sdesc">-10kg du top set · 5 reps</span>'
    +'<span class="skg" style="color:var(--text2)">'+(bo2Kg?bo2Kg+' kg':'—')+'</span></div>'
    +'</div>'
    +'<div class="cluster-box">Si moins de 5 reps propres → Cluster : 1 rep · pause 20-30s · repete jusqu\'a 5 reps total · meme charge · augmente quand meme semaine suivante<br>Si cluster echoue (max 5 singles) → Deload + nouveau cycle</div>'
    +'<div class="note-box">'+day.force.note+'</div></div>';

  // HYP
  html+='<div class="hyp"><div class="hyp-title">HYPERTROPHIE</div>';
  day.supersets.forEach(function(ss){
    html+='<div class="ss-label">'+ss.label+'</div>';
    ss.exs.forEach(function(ex){
      var setsCol=parseInt(ex.sets)>=4?'var(--purple)':ex.arm?'var(--gold)':'var(--green)';
      html+='<div class="ex-row">'
        +'<div class="ex-left">'
        +'<div class="ex-id">'+ex.id+'</div>'
        +'<div class="ex-name">'+ex.n+'</div>'
        +'<div class="ex-detail">'+ex.d+'</div>'
        +(ex.rp?'<span class="mbadge m-rp">Rest Pause</span>':'')
        +(ex.myo?'<span class="mbadge m-myo">Myo Reps derniere serie</span>':'')
        +'</div>'
        +'<div class="ex-right">'
        +'<div class="ex-sets" style="color:'+setsCol+'">'+ex.sets+'s</div>'
        +'<div class="ex-reps">'+ex.reps+' reps</div>'
        +'</div></div>';
    });
  });
  html+='</div>';

  // RM update
  html+='<div style="background:var(--bg3);border-radius:var(--rs);padding:11px;margin-top:4px">'
    +'<div style="font-size:10px;color:var(--text2);letter-spacing:1px;margin-bottom:2px">METTRE A JOUR MES 1RM</div>'
    +'<div style="font-size:10px;color:var(--text2);opacity:0.7;margin-bottom:8px">Les charges se recalculent automatiquement</div>'
    +'<div class="rm-grid">'
    +'<div class="rmf"><label>BENCH</label><input type="number" inputmode="decimal" id="rm-b" placeholder="'+RM.bench+'"/></div>'
    +'<div class="rmf"><label>SQUAT</label><input type="number" inputmode="decimal" id="rm-s" placeholder="'+RM.squat+'"/></div>'
    +'<div class="rmf"><label>SDT</label><input type="number" inputmode="decimal" id="rm-d" placeholder="'+RM.sdt+'"/></div>'
    +'<div class="rmf"><label>MILITAIRE</label><input type="number" inputmode="decimal" id="rm-o" placeholder="'+RM.ohp+'"/></div>'
    +'</div>'
    +'<button class="btn-s" onclick="updRM()">Mettre a jour</button></div>';

  el.innerHTML=html;
}

function updRM(){
  var f=function(id,def){return parseFloat(document.getElementById(id).value)||def;};
  RM.bench=f('rm-b',RM.bench);RM.squat=f('rm-s',RM.squat);
  RM.sdt=f('rm-d',RM.sdt);RM.ohp=f('rm-o',RM.ohp);
  svRM();toast('1RM mis a jour');renderProg();
}

// TOP SET
function renderTS(){
  var el=document.getElementById('pg-topset');
  var hist=TS.filter(function(t){return t.mv===curMv;}).sort(function(a,b){return a.date.localeCompare(b.date);});
  var c=MV_COLORS[curMv];

  var html='<div class="card"><div class="ct">Enregistrer un top set</div>'
    +'<div class="mv-sel">'
    +Object.keys(MV_LABELS).map(function(mv){
      return '<button class="mv-btn" onclick="selMV(\''+mv+'\')" style="'+(mv===curMv?'background:'+MV_COLORS[mv]+';border-color:'+MV_COLORS[mv]+';color:#000':'')+'">'+MV_LABELS[mv]+'</button>';
    }).join('')+'</div>'
    +'<div class="ts-grid">'
    +'<div class="tf"><label>CHARGE (kg)</label><input type="number" inputmode="decimal" step="0.5" id="ts-c" placeholder="---"/></div>'
    +'<div class="tf"><label>REPS</label><input type="number" inputmode="numeric" id="ts-r" placeholder="---"/></div>'
    +'<div class="tf"><label>RPE</label><select id="ts-rpe"><option value="">—</option>'
    +[5,6,6.5,7,7.5,8,8.5,9,9.5,10].map(function(x){return '<option value="'+x+'">'+x+'</option>';}).join('')
    +'</select></div></div>'
    +'<button class="btn-calc" onclick="calcTS()">Calculer et sauvegarder</button>'
    +'<div id="ts-result"></div></div>'
    +'<div class="card"><div class="ct">1RM estimes</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">'
    +Object.keys(MV_LABELS).map(function(mv){
      return '<div style="text-align:center;background:var(--bg3);border-radius:var(--rs);padding:10px">'
        +'<div style="font-size:9px;color:var(--text2);margin-bottom:3px">'+MV_LABELS[mv]+'</div>'
        +'<div style="font-size:18px;font-weight:700;color:'+MV_COLORS[mv]+'">'+RM[mv]+' kg</div></div>';
    }).join('')+'</div>'
    +'<div style="text-align:center;font-size:11px;color:var(--text2);margin-top:9px">'
    +'Total (B+S+SDT) : <b style="color:var(--gold)">'+(RM.bench+RM.squat+RM.sdt)+' kg</b></div></div>';

  if(hist.length>1){
    html+='<div class="card"><div class="ct">Courbe — '+MV_LABELS[curMv]+'</div>'
      +'<div class="chart-wrap"><canvas id="pc"></canvas></div></div>';
  }

  if(hist.length){
    html+='<div class="card"><div class="ct">Historique — '+MV_LABELS[curMv]+'</div>'
      +hist.slice().reverse().map(function(t,i,arr){
        var prev=arr[i+1];
        var delta=prev?t.rm1-prev.rm1:null;
        return '<div class="hist-row">'
          +'<div style="flex:1"><div style="font-size:11px;color:var(--text2)">'+fd(t.date)+'</div>'
          +'<div style="font-size:13px">'+t.charge+'kg × '+t.reps+' @ RPE '+t.rpe+'</div>'
          +(delta!==null?'<span class="'+(delta>0?'badge-up':'badge-dn')+'">'+(delta>0?'+':'')+delta+' kg</span>':'')
          +'</div>'
          +'<div style="text-align:right;display:flex;align-items:center;gap:8px">'
          +'<div><div style="font-size:17px;font-weight:700;color:'+c+'">'+t.rm1+' kg</div>'
          +'<div style="font-size:10px;color:var(--text2)">1RM estime</div></div>'
          +'<button class="btn-del" onclick="delTS('+t.id+')">🗑</button>'
          +'</div></div>';
      }).join('')+'</div>';
  }

  el.innerHTML=html;

  if(hist.length>1){
    setTimeout(function(){
      var ctx=document.getElementById('pc');
      if(!ctx)return;
      if(perfChart){perfChart.destroy();perfChart=null;}
      var colors=hist.map(function(t){var r=parseFloat(t.rpe);return r<7.5?'#4ade80':r<=8.5?'#f5a623':'#f87171';});
      perfChart=new Chart(ctx,{
        type:'line',
        data:{labels:hist.map(function(e){return fd(e.date);}),datasets:[{
          data:hist.map(function(e){return e.rm1;}),
          borderColor:c,backgroundColor:'rgba(0,0,0,0)',
          pointBackgroundColor:colors,pointBorderColor:colors,
          pointRadius:6,tension:0.3,borderWidth:2
        }]},
        options:{responsive:true,maintainAspectRatio:false,
          plugins:{legend:{display:false}},
          scales:{x:{ticks:{font:{size:10},maxRotation:40},grid:{display:false}},
                  y:{ticks:{font:{size:11}},grid:{color:'rgba(128,128,128,0.1)'}}}
        }
      });
    },100);
  }
}

function selMV(mv){curMv=mv;renderTS();}

function calcTS(){
  var c=parseFloat(document.getElementById('ts-c').value);
  var r=parseFloat(document.getElementById('ts-r').value);
  var rpe=document.getElementById('ts-rpe').value;
  if(!c||!r||!rpe){toast('Remplis charge, reps et RPE');return;}
  var est=calc1RM(c,r,parseFloat(rpe));
  var prev=RM[curMv];
  var delta=est-prev;
  RM[curMv]=est;svRM();
  TS.push({mv:curMv,date:today(),charge:c,reps:r,rpe:parseFloat(rpe),rm1:est,id:Date.now()});
  svTS();
  var col=MV_COLORS[curMv];
  document.getElementById('ts-result').innerHTML='<div class="result-box" style="background:'+col+'12;border-color:'+col+'40">'
    +'<div style="font-size:10px;color:'+col+';letter-spacing:1px;margin-bottom:4px">1RM ESTIME — '+MV_LABELS[curMv]+'</div>'
    +'<div style="font-size:36px;font-weight:900;color:'+col+'">'+est+' <span style="font-size:13px;font-weight:400">kg</span></div>'
    +(delta!==0?'<div style="font-size:13px;font-weight:600;color:'+(delta>0?'var(--green)':'var(--red)')+';margin-top:4px">'+(delta>0?'+':'')+delta+' kg vs precedent</div>':'')
    +'<div style="font-size:11px;margin-top:6px;color:var(--text2)">Charges mises a jour automatiquement</div></div>';
  toast('1RM mis a jour : '+est+' kg');
  renderTS();
}

function delTS(id){
  if(!confirm('Supprimer ?'))return;
  TS=TS.filter(function(t){return t.id!==id;});
  ['bench','squat','sdt','ohp'].forEach(function(mv){
    var e=TS.filter(function(t){return t.mv===mv;}).sort(function(a,b){return b.date.localeCompare(a.date);});
    var def={bench:100,squat:110,sdt:145,ohp:55};
    RM[mv]=e.length?e[0].rm1:def[mv];
  });
  svTS();svRM();toast('Supprime');renderTS();
}

// INFO
function renderInfo(){
  var el=document.getElementById('pg-info');
  var html='<div class="card"><div class="ct">Logique de progression force</div>'
    +'<div style="font-size:11px;color:var(--text2);margin-bottom:14px">Depart a ~78% 1RM · 5 reps · 2 back-off</div>'
    +[
      {e:'✅',t:'5 reps propres',d:'Augmente la semaine suivante : +2.5kg bench/militaire · +5kg squat/SDT',c:'var(--green)'},
      {e:'⚡',t:'Moins de 5 reps → Cluster',d:'1 rep · pause 20-30s · repete jusqu\'a 5 reps total · meme charge · augmente quand meme semaine suivante',c:'var(--gold)'},
      {e:'❌',t:'Cluster echoue',d:'Tu n\'atteins pas 5 reps meme en cluster (max 5 singles) → Deload + nouveau cycle',c:'var(--red)'},
      {e:'🔄',t:'Deload',d:'1 semaine a 60% · technique uniquement · puis nouveau cycle recalibre sur 1RM Top Set',c:'var(--purple)'},
    ].map(function(x){
      return '<div style="display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)">'
        +'<span style="font-size:22px;flex-shrink:0">'+x.e+'</span>'
        +'<div><div style="font-size:13px;font-weight:600;color:'+x.c+';margin-bottom:3px">'+x.t+'</div>'
        +'<div style="font-size:11px;color:var(--text2);line-height:1.5">'+x.d+'</div></div></div>';
    }).join('')
    +'</div>'

    +'<div class="card"><div class="ct">Methodes hypertrophie</div>'
    +'<div class="ib">Uniquement sur les exercices marques. Sur les autres : series classiques jusqu\'a 2 reps de l\'echec.</div>'
    +[
      {badge:'Rest Pause',cls:'m-rp',d:'Serie normale jusqu\'a quasi-echec · pause 15s · max reps · pause 15s · max reps'},
      {badge:'Myo Reps',cls:'m-myo',d:'Serie normale · mini-pauses de 3-5 respirations · 2-3 reps · repete 3-4 fois · sur la derniere serie uniquement'},
    ].map(function(x){
      return '<div style="padding:10px 0;border-bottom:1px solid var(--border)">'
        +'<span class="mbadge '+x.cls+'" style="margin-bottom:6px;display:inline-block">'+x.badge+'</span>'
        +'<div style="font-size:11px;color:var(--text2);line-height:1.5">'+x.d+'</div></div>';
    }).join('')
    +'</div>'

    +'<div class="card"><div class="ct">1RM actuels</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">'
    +[['BENCH',RM.bench,'#f5a623'],['SQUAT',RM.squat,'#7bed9f'],['SDT',RM.sdt,'#00b4d8'],['MILITAIRE',RM.ohp,'#e94560']].map(function(x){
      var start=kgFrom(parseFloat(x[1]),78);
      return '<div style="text-align:center;background:var(--bg3);border-radius:var(--rs);padding:10px">'
        +'<div style="font-size:9px;color:var(--text2);margin-bottom:3px">'+x[0]+'</div>'
        +'<div style="font-size:18px;font-weight:700;color:'+x[2]+'">'+x[1]+' kg</div>'
        +'<div style="font-size:10px;color:var(--text2);margin-top:2px">Depart : '+start+' kg</div></div>';
    }).join('')+'</div>'
    +'<div style="text-align:center;font-size:11px;color:var(--text2);margin-top:9px">'
    +'Total competition : <b style="color:var(--gold)">'+(RM.bench+RM.squat+RM.sdt)+' kg</b></div></div>';

  el.innerHTML=html;
}

// BACKUP
function renderBackup(){
  var el=document.getElementById('pg-backup');
  el.innerHTML='<div class="card"><div class="ct">Sauvegarde</div>'
    +'<div class="ib">Exporte tes donnees pour ne pas les perdre.</div>'
    +'<button class="btn-p" onclick="exportData()">Exporter mes donnees</button>'
    +'<button class="btn-g" onclick="importData()">Importer une sauvegarde</button>'
    +'</div>';
}

function exportData(){
  var data=JSON.stringify({rm:RM,ts:TS,cd:cd},null,2);
  var blob=new Blob([data],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='bt_power_'+today()+'.json';
  a.click();URL.revokeObjectURL(url);toast('Exporte');
}

function importData(){
  var input=document.createElement('input');
  input.type='file';input.accept='.json';
  input.onchange=function(e){
    var file=e.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var p=JSON.parse(ev.target.result);
        if(!confirm('Restaurer ?'))return;
        if(p.rm)RM=p.rm;if(p.ts)TS=p.ts;
        if(p.cd!==undefined)cd=p.cd;
        svRM();svTS();svCD();toast('Restaure');SP('prog');
      }catch(e){toast('Erreur');}
    };
    reader.readAsText(file);
  };
  input.click();
}

ldCD();
renderProg();renderInfo();renderBackup();
</script>
</body>
</html>
