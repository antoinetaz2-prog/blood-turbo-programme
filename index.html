<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="B&T Power">
<title>Blood & Turbo Power</title>
<style>
:root{--bg:#0a0a10;--bg2:#12121e;--bg3:#1a1a28;--border:#252535;--text:#e0e0ee;--text2:#888899;--accent:#e94560;--gold:#f5a623;--green:#4ade80;--red:#f87171;--blue:#4a9eff;--purple:#c084fc;--r:12px;--rs:8px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;overscroll-behavior:none;}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;}
.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;}
.ht{font-size:17px;font-weight:900;letter-spacing:2px;color:var(--accent);}
.hs{font-size:10px;color:var(--text2);margin-top:1px;letter-spacing:1px;}
.nav{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.nb{flex:1;padding:10px 2px 8px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text2);font-size:9px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;}
.nb.active{border-bottom-color:var(--accent);color:var(--accent);}
.ni{font-size:17px;}
.pg{display:none;overflow-y:auto;padding:14px;padding-bottom:40px;}
.pg.active{display:block;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;}
.ct{font-size:10px;font-weight:700;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px;}
.days{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
.db{flex:0 0 auto;padding:8px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:25px;color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.ph-banner{border-radius:var(--r);padding:11px 13px;margin-bottom:12px;display:flex;align-items:center;gap:10px;border:1px solid;}
.ph-badge{width:36px;height:36px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;color:#000;flex-shrink:0;}
.dl-banner{border-radius:var(--r);padding:18px;margin-bottom:10px;text-align:center;border:1px solid rgba(192,132,252,0.4);background:rgba(192,132,252,0.08);}
.dl-rule{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;}
.dl-rule:last-child{border-bottom:none;}
.fb{border-radius:var(--r);padding:14px;margin-bottom:10px;border:1px solid;}
.fl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:3px;}
.fm{font-size:20px;font-weight:900;color:#fff;margin-bottom:12px;}
.rpe-box{border-radius:var(--rs);padding:12px;margin-bottom:12px;text-align:center;border:1px solid;}
.rpe-v{font-size:34px;font-weight:900;}
.pyr{background:var(--bg3);border-radius:var(--rs);padding:11px;margin-bottom:10px;}
.pyr-r{display:grid;grid-template-columns:38px 1fr 1fr 68px;gap:5px;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;}
.pyr-r:last-child{border-bottom:none;}
.note{background:rgba(233,69,96,0.08);border:1px solid rgba(233,69,96,0.25);border-radius:var(--rs);padding:9px 11px;font-size:11px;color:var(--accent);line-height:1.5;margin-top:8px;}
.ib{background:var(--bg3);border-radius:var(--rs);padding:11px;font-size:11px;color:var(--text2);line-height:1.6;margin-bottom:10px;}
.hyp{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:10px;}
.hy-t{font-size:10px;font-weight:700;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;}
.vb{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:10px;border:1px solid;}
.ei{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:11px;margin-bottom:7px;}
.en{font-size:13px;font-weight:600;margin-bottom:2px;}
.ed{font-size:11px;color:var(--text2);line-height:1.4;margin-bottom:5px;}
.em{display:inline-block;padding:2px 7px;border-radius:20px;font-size:9px;font-weight:700;}
.m-myo{background:rgba(74,222,128,0.15);color:var(--green);}
.m-dc{background:rgba(192,132,252,0.15);color:var(--purple);}
.m-ss{background:rgba(245,166,35,0.15);color:var(--gold);}
.m-drp{background:rgba(255,107,157,0.15);color:#ff6b9d;}
/* TOP SET */
.mv-sel{display:flex;gap:7px;margin-bottom:14px;}
.mv-btn{flex:1;padding:10px 4px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text2);font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;line-height:1.3;}
.ts-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.tf label{font-size:10px;color:var(--text2);display:block;text-align:center;margin-bottom:4px;}
.tf input,.tf select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:11px 6px;color:var(--text);font-size:16px;text-align:center;width:100%;font-family:inherit;}
.btn-calc{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:12px;}
.result-box{border-radius:var(--r);padding:16px;text-align:center;border:1px solid;margin-bottom:12px;}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
.hist-row:last-child{border-bottom:none;}
.badge-up{background:rgba(74,222,128,0.15);color:var(--green);padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-dn{background:rgba(248,113,113,0.15);color:var(--red);padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.btn-del{background:none;border:none;color:var(--red);font-size:17px;cursor:pointer;padding:2px 5px;line-height:1;flex-shrink:0;}
/* CHART */
.chart-wrap{width:100%;height:180px;position:relative;margin:10px 0;}
canvas{display:block;}
/* CYCLE */
.ph-big{border-radius:var(--r);padding:14px;margin-bottom:10px;border:1px solid;}
.bar-row{margin-top:7px;}
.bar-h{display:flex;justify-content:space-between;font-size:10px;opacity:0.7;margin-bottom:3px;}
.bar-t{height:4px;border-radius:2px;background:rgba(255,255,255,0.1);}
.bar-f{height:100%;border-radius:2px;}
.sig{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
.sig:last-child{border-bottom:none;}
/* FORME */
.fc{background:var(--bg2);border-radius:var(--r);overflow:hidden;margin-bottom:10px;border:1px solid;}
.fh{padding:13px;display:flex;align-items:center;gap:11px;}
.fb2{padding:13px;}
.fr{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);}
.fr:last-child{border-bottom:none;}
.fk{font-size:11px;color:var(--text2);}
.fv{font-size:12px;color:var(--text);text-align:right;max-width:58%;}
.ft{margin-top:9px;padding:9px;border-radius:var(--rs);font-size:11px;font-style:italic;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 20px;border-radius:25px;font-size:13px;font-weight:600;opacity:0;transition:opacity 0.25s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;}
</style>
</head>

<script>
var RM=JSON.parse(localStorage.getItem('btp_rm')||'null')||{bench:101,squat:105,sdt:145,ohp:0};
var TS=JSON.parse(localStorage.getItem('btp_ts')||'[]');
var curMv='sdt';
var perfChart=null;
function svRM(){localStorage.setItem('btp_rm',JSON.stringify(RM));}
function svTS(){localStorage.setItem('btp_ts',JSON.stringify(TS));}

var WC=[null,
  {ph:1,rpe:"7",reps:"4-6",name:"ACCUMULATION"},
  {ph:1,rpe:"7",reps:"4-6",name:"ACCUMULATION"},
  {ph:1,rpe:"7.5",reps:"4-6",name:"ACCUMULATION"},
  {ph:1,rpe:"8",reps:"3-5",name:"ACCUMULATION"},
  {ph:1,rpe:"8",reps:"3-5",name:"ACCUMULATION"},
  {ph:0,rpe:"6",reps:"3-4",name:"DELOAD"},
  {ph:2,rpe:"8",reps:"3-4",name:"INTENSIFICATION"},
  {ph:2,rpe:"8.5",reps:"3-4",name:"INTENSIFICATION"},
  {ph:2,rpe:"8.5",reps:"2-4",name:"INTENSIFICATION"},
  {ph:2,rpe:"9",reps:"2-3",name:"INTENSIFICATION"},
  {ph:2,rpe:"9",reps:"2-3",name:"INTENSIFICATION"},
  {ph:0,rpe:"6",reps:"3-4",name:"DELOAD"},
  {ph:3,rpe:"9",reps:"2-3",name:"PIC DE FORCE"},
  {ph:3,rpe:"9.5",reps:"1-3",name:"PIC DE FORCE"},
  {ph:3,rpe:"9.5",reps:"1-2",name:"PIC DE FORCE"},
  {ph:4,rpe:"6",reps:"2-3",name:"PEAK"},
];
var PC={0:"#c084fc",1:"#4ade80",2:"#fb923c",3:"#f87171",4:"#c084fc"};
var PBG={0:"rgba(192,132,252,0.1)",1:"rgba(74,222,128,0.1)",2:"rgba(251,146,60,0.1)",3:"rgba(248,113,113,0.1)",4:"rgba(192,132,252,0.1)"};

var RPE_FACTOR={10:1,9.5:1.022,9:1.044,8.5:1.067,8:1.091,7.5:1.116,7:1.143,6.5:1.171,6:1.2,5:1.25};
function calc1RM(c,r,rpe){
  var epley=c*(1+r/30);
  var f=RPE_FACTOR[parseFloat(rpe)]||1;
  return Math.round(epley*f);
}

function getPyr(rm,ph,rpe){
  if(!rm||ph===0||ph===4)return null;
  var r={
    1:[[0.45,"8","Echauff."],[0.55,"5","Echauff."],[0.65,"3","Echauff."],[0.73,"2","Approche"],[0.80,"1","Approche"],[null,"4-6 @ RPE "+rpe,"TOP SET"]],
    2:[[0.5,"5","Echauff."],[0.6,"3","Echauff."],[0.7,"2","Echauff."],[0.8,"1","Approche"],[0.87,"1","Approche"],[null,"2-4 @ RPE "+rpe,"TOP SET"]],
    3:[[0.5,"3","Echauff."],[0.6,"2","Echauff."],[0.7,"1","Echauff."],[0.8,"1","Approche"],[0.875,"1","Approche"],[0.925,"1","Approche"],[null,"1-3 @ RPE "+rpe,"TOP SET"]],
  };
  return r[ph];
}
function rnd(rm,p){return Math.round(rm*p/2.5)*2.5+' kg';}
function getVL(ph){return {0:3,1:0,2:1,3:2,4:3}[ph];}
var VLC=["#4ade80","#facc15","#fb923c","#f87171"];
var VLN=["PLEIN","REDUIT","MINIMAL","SUPPRIME"];

var MV_LABELS={bench:'BENCH',squat:'SQUAT',sdt:'SDT',ohp:'MILITAIRE'};
var MV_COLORS={bench:'#f5a623',squat:'#7bed9f',sdt:'#00b4d8',ohp:'#e94560'};

var DAYS=[
  {id:0,short:"LUN",label:"LUNDI",accent:"#00b4d8",
   force:{mv:"SOULE DE TERRE (SDT)",rm:"sdt",note:"Barre conventionnelle. Dos neutre imperatif. Sangles. RER 1 — jamais a l'echec."},
   hyp:{title:"DOS + ARRIERE EPAULE + LOMBAIRES",exs:[
     {n:"Mollets (entre series SDT)",d:"3x15-20 pendant echauffement SDT",m:null,sv:[2,1,1]},
     {n:"Tirage vertical poulie haute unilateral",d:"2 series . 8-10 reps/bras . DRP sur derniere",m:"DRP",sv:[2,1,1]},
     {n:"Rowing Hammer focus trapezes",d:"2 series . 8-10 reps",m:null,sv:[2,2,1]},
     {n:"Pull-over poulie",d:"2 series . 12-15 reps . Tension constante",m:null,sv:[2,1,0]},
     {n:"Oiseau halteres buste penche",d:"2 series . 12-15 reps . Myo Reps derniere",m:"MYO",sv:[2,1,0]},
     {n:"Back extension",d:"2 series . 12-15 reps . Excentrique controle",m:null,sv:[2,1,1]},
   ]}},
  {id:1,short:"MER",label:"MERCREDI",accent:"#f5a623",
   force:{mv:"DEVELOPPE COUCHE BARRE",rm:"bench",note:"Prise competition. Arc lombaire controle. Pieds au sol. Toucher poitrine obligatoire."},
   hyp:{title:"BICEPS + PECTORAUX",exs:[
     {n:"Curl incline halteres",d:"2 series . 8-10 reps . Double Contraction",m:"DC",sv:[2,2,1],p:true},
     {n:"Curl pupitre",d:"2 series . 8-10 reps . Isolation stricte",m:null,sv:[2,1,1],p:true},
     {n:"Tractions prise neutre",d:"2 series . 6-10 reps",m:null,sv:[2,1,0]},
     {n:"Dev. Hammer convergente unilateral",d:"2 series . 8-10 reps . Focus haut de pec",m:null,sv:[2,2,1]},
     {n:"Pec dec",d:"2 series . 12-15 reps . Myo Reps derniere",m:"MYO",sv:[2,1,0]},
   ]}},
  {id:2,short:"JEU",label:"JEUDI",accent:"#7bed9f",
   force:{mv:"SQUAT BARRE BASSE",rm:"squat",note:"Barre basse sur trapezes. Profondeur competition (pli hanche sous genou). Cage securite reglee."},
   hyp:{title:"CUISSES + MOLLETS + ADDUCTEURS",exs:[
     {n:"Presse inclinee + Mollets presse",d:"2 series . 8-10 / 15-20 . Superset enchaine",m:"SS",sv:[2,2,1]},
     {n:"SDT jambes tendues halteres",d:"2 series . 8-10 reps . Jambes verrouilees . RER 1",m:null,sv:[2,1,1]},
     {n:"Adducteurs machine",d:"2 series . 15-20 reps",m:null,sv:[2,1,0]},
     {n:"Abducteurs machine",d:"2 series . 15-20 reps",m:null,sv:[2,1,0]},
     {n:"[OPT] Leg curl assis",d:"2 series . 10-12 reps . Si energie suffisante",m:null,sv:[1,1,0]},
   ]}},
  {id:3,short:"SAM",label:"SAMEDI",accent:"#e94560",
   force:{mv:"DEV. MILITAIRE ASSIS BARRE",rm:"ohp",note:"Assis, barre. Gainage strict. Barre au menton. 1RM calibre progressivement via tes top sets."},
   hyp:{title:"EPAULES + TRAPEZES + COU + BRAS",exs:[
     {n:"Elev. lat. assis halteres",d:"2 series . 15-20 reps . Buste sur banc incline . Deltoide moyen",m:null,sv:[2,2,1]},
     {n:"Elev. lat. poulie basse",d:"2 series . 15-20 reps/bras . Myo Reps derniere",m:"MYO",sv:[2,1,1]},
     {n:"Oiseau poulie",d:"2 series . 12-15 reps . Deltoide post.",m:null,sv:[2,1,0]},
     {n:"Shrug halteres",d:"2 series . 10-12 reps . Pause 1s en haut . Trapezes superieurs",m:null,sv:[2,2,1]},
     {n:"Flexion / extension cou harnais",d:"2 series chaque sens . Charge legere . Amplitude complete",m:null,sv:[2,2,1]},
     {n:"Extension cou machine ischio",d:"2 series . Si temps . Nuque arriere",m:null,sv:[1,1,0]},
     {n:"Magic triceps EZ + Reverse curl EZ",d:"2 series . 8-10 chacun . Superset meme barre",m:"SS",sv:[2,2,1]},
     {n:"Curl biceps poulie",d:"2 series . 12-15 reps . Finition",m:null,sv:[2,1,1]},
   ]}},
];

var cd=0,cw=1;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
function today(){return new Date().toISOString().split('T')[0];}
function fd(s){return new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}

function SP(p){
  document.querySelectorAll('.pg').forEach(function(x){x.classList.remove('active');});
  document.querySelectorAll('.nb').forEach(function(x){x.classList.remove('active');});
  document.getElementById('pg-'+p).classList.add('active');
  document.getElementById('nav-'+p).classList.add('active');
  if(p==='programme')RP();
  if(p==='topset')RTS();
  if(p==='cycle')RC();
  if(p==='forme')RF();
}

function SD(i){cd=i;RP();}

// ── PROGRAMME ──
function RP(){
  var el=document.getElementById('pg-programme');
  var day=DAYS[cd],wc=WC[cw],pc=PC[wc.ph],pb=PBG[wc.ph];
  var isD=wc.ph===0||wc.ph===4;
  var rm=day.force.rm?RM[day.force.rm]:null;
  var pyr=getPyr(rm,wc.ph,wc.rpe);
  var vl=getVL(wc.ph);
  var vlC=VLC[vl],vlN=VLN[vl];

  var dsel='<div class="days">'+DAYS.map(function(d,i){
    return '<button class="db" onclick="SD('+i+')" style="'+(i===cd?'background:'+d.accent+';border-color:'+d.accent+';color:#000':'')+'">'+d.short+'</button>';
  }).join('')+'</div>';

  var wsl='<div style="margin-bottom:12px">'
  +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">'
  +'<span style="font-size:11px;color:var(--text2)">Semaine</span>'
  +'<span style="font-size:12px;font-weight:700;color:'+pc+'">S'+cw+' — '+wc.name+'</span></div>'
  +'<input type="range" min="1" max="16" value="'+cw+'" oninput="cw=parseInt(this.value);RP()" style="width:100%;accent-color:'+pc+'"/>'
  +'<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text2);margin-top:3px">'
  +'<span>S1</span><span>S6&#x1F504;</span><span>S11</span><span>S12&#x1F504;</span><span>S16</span></div></div>';

  if(isD){
    el.innerHTML=dsel+wsl
    +'<div class="dl-banner">'
    +'<div style="font-size:36px;margin-bottom:7px">&#x1F504;</div>'
    +'<div style="font-size:18px;font-weight:900;color:var(--purple);margin-bottom:5px">SEMAINE DELOAD</div>'
    +'<div style="font-size:12px;color:var(--text2);line-height:1.6">Recuperation active. Entretien technique uniquement.</div>'
    +'<div style="background:var(--bg3);border-radius:var(--rs);padding:11px;margin-top:11px;text-align:left">'
    +'<div class="dl-rule"><span style="font-size:17px">&#x26A1;</span><div><b style="font-size:12px">Force</b><div style="font-size:11px;color:var(--text2)">RPE 6 max . 50-60% 1RM . pyramide courte</div></div></div>'
    +'<div class="dl-rule"><span style="font-size:17px">&#x1F3CB;</span><div><b style="font-size:12px">Hypertrophie</b><div style="font-size:11px;color:var(--text2)">Supprimee ou 1 serie legere . aucune methode</div></div></div>'
    +'<div class="dl-rule"><span style="font-size:17px">&#x1F634;</span><div><b style="font-size:12px">Recuperation</b><div style="font-size:11px;color:var(--text2)">Sommeil prioritaire . calories maintenance</div></div></div>'
    +'</div></div>';
    return;
  }

  var pyrH=pyr
    ?'<div class="pyr"><div style="font-size:10px;color:var(--text2);letter-spacing:1px;margin-bottom:7px">PYRAMIDE'+(rm?' — 1RM estimé '+rm+' kg':'')+'</div>'
    +pyr.map(function(row){
      var p=row[0],r=row[1],t=row[2];
      var col=t==='TOP SET'?pc:t==='Approche'?'var(--gold)':'var(--text2)';
      return '<div class="pyr-r"><span style="font-weight:700;color:'+col+'">'+(p?Math.round(p*100)+'%':'&#x2191;')+'</span>'
        +'<span>'+(p?rnd(rm,p):'Top set')+'</span>'
        +'<span style="font-size:11px;color:var(--text2)">'+r+'</span>'
        +'<span style="font-size:10px;text-align:right;color:'+col+'">'+t+'</span></div>';
    }).join('')+'</div>'
    :'<div class="ib">Monte au ressenti. Le 1RM se calibre au fil de tes top sets enregistres.</div>';

  var mc={MYO:'m-myo',DC:'m-dc',SS:'m-ss',DRP:'m-drp'};
  var exH=day.hyp.exs.map(function(ex){
    var sets=vl<3?ex.sv[Math.min(vl,2)]:0;
    var sup=sets===0;

function updRM(){
  var b=parseFloat(document.getElementById('rm-b').value);
  var s=parseFloat(document.getElementById('rm-s').value);
  var d=parseFloat(document.getElementById('rm-d').value);
  var o=parseFloat(document.getElementById('rm-o')&&document.getElementById('rm-o').value||0);
  if(b)RM.bench=b;if(s)RM.squat=s;if(d)RM.sdt=d;if(o)RM.ohp=o;
  svRM();toast('1RM mis a jour');RP();
}

  +'</div></div>':'')

          }
        }

    },100);

function selMV(mv){curMv=mv;RTS();}

function calcTS(){
  var c=parseFloat(document.getElementById('ts-c').value);
  var r=parseFloat(document.getElementById('ts-r').value);
  var rpe=document.getElementById('ts-rpe').value;
  if(!c||!r||!rpe){toast('Remplis charge, reps et RPE');return;}
  var est=calc1RM(c,r,parseFloat(rpe));
  var prev=RM[curMv];
  var delta=est-prev;
  RM[curMv]=est;
  svRM();
  TS.push({mv:curMv,date:today(),charge:c,reps:r,rpe:parseFloat(rpe),rm1:est,id:Date.now()});
  svTS();
  var col=MV_COLORS[curMv];
  document.getElementById('ts-result').innerHTML='<div class="result-box" style="background:'+col+'12;border-color:'+col+'40;margin-bottom:0">'
  +'<div style="font-size:10px;letter-spacing:1px;color:'+col+';margin-bottom:4px">1RM ESTIME — '+MV_LABELS[curMv]+'</div>'
  +'<div style="font-size:38px;font-weight:900;color:'+col+'">'+est+' <span style="font-size:14px;font-weight:400">kg</span></div>'
  +(delta!==0?'<div style="font-size:13px;font-weight:600;color:'+(delta>0?'var(--green)':'var(--red)')+';margin-top:4px">'+(delta>0?'+':'')+delta+' kg vs precedent</div>':'')
  +'<div style="font-size:11px;margin-top:6px;color:var(--text2)">Pyramide mise a jour automatiquement</div>'
  +'</div>';
  toast('1RM mis a jour : '+est+' kg');
  RTS();
}

function delTS(id){
  if(!confirm('Supprimer cette entree ?'))return;
  TS=TS.filter(function(t){return t.id!==id;});
  // Recalculate ALL 1RM from remaining entries
  ['bench','squat','sdt'].forEach(function(mv){
    var entries=TS.filter(function(t){return t.mv===mv;}).sort(function(a,b){return b.date.localeCompare(a.date);});
    if(entries.length){
      RM[mv]=entries[0].rm1;
    } else {
      // Reset to initial values if no entries left
      var defaults={bench:101,squat:105,sdt:145,ohp:0};
      RM[mv]=defaults[mv];
    }
  });
  svTS();svRM();
  toast('Entree supprimee');
  RTS();
}

function exportData(){
  var data=JSON.stringify({rm:RM,ts:TS},null,2);
  var blob=new Blob([data],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='bt_programme_backup_'+today()+'.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Sauvegarde exportee');
}

function importData(){
  var input=document.createElement('input');
  input.type='file';
  input.accept='.json';
  input.onchange=function(e){
    var file=e.target.files[0];
    if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var parsed=JSON.parse(ev.target.result);
        if(!parsed.rm||!parsed.ts){toast('Fichier invalide');return;}
        if(!confirm('Restaurer cette sauvegarde ? Les donnees actuelles seront remplacees.'))return;
        RM=parsed.rm;
        TS=parsed.ts;
        svRM();svTS();
        toast('Donnees restaurees — '+TS.length+' top sets');
        SP('topset');
      }catch(e){toast('Erreur de lecture du fichier');}
    };
    reader.readAsText(file);
  };
  input.click();
}

RP();RC();RF();
</script>
