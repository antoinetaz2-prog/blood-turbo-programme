<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="B&T Power">
<title>Blood & Turbo Power</title>
<style>
:root{--bg:#0a0a10;--bg2:#12121e;--bg3:#1a1a28;--border:#252535;--text:#e0e0ee;--text2:#888899;--accent:#e94560;--gold:#f5a623;--green:#4ade80;--red:#f87171;--blue:#4a9eff;--purple:#c084fc;--r:12px;--rs:8px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;overscroll-behavior:none;}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;}
.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;}
.ht{font-size:17px;font-weight:900;letter-spacing:2px;color:var(--accent);}
.hs{font-size:10px;color:var(--text2);margin-top:1px;letter-spacing:1px;}
.nav{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.nb{flex:1;padding:10px 1px 8px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text2);font-size:8px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;}
.nb.active{border-bottom-color:var(--accent);color:var(--accent);}
.ni{font-size:16px;}
.pg{display:none;overflow-y:auto;padding:14px;padding-bottom:40px;}
.pg.active{display:block;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;}
.ct{font-size:10px;font-weight:700;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px;}
/* DAY SELECTOR */
.days{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
.db{flex:0 0 auto;padding:9px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:25px;color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
/* WEEK SLIDER */
.week-wrap{margin-bottom:14px;}
.week-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.week-label{font-size:12px;color:var(--text2);}
.week-val{font-size:13px;font-weight:700;}
/* PHASE BANNER */
.phase-banner{border-radius:var(--r);padding:12px 14px;margin-bottom:12px;border:1px solid;display:flex;align-items:center;gap:10px;}
.phase-badge{width:42px;height:42px;border-radius:var(--rs);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.phase-badge-s{font-size:10px;font-weight:700;color:#000;}
.phase-badge-rpe{font-size:14px;font-weight:900;color:#000;}
/* FORCE BLOCK */
.force-block{border-radius:var(--r);padding:14px;margin-bottom:10px;border:1px solid;}
.force-tag{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:3px;}
.force-mv{font-size:18px;font-weight:900;color:#fff;margin-bottom:4px;}
.force-type{font-size:11px;margin-bottom:12px;opacity:0.7;}
/* RPE BOX */
.rpe-box{border-radius:var(--rs);padding:12px;margin-bottom:12px;text-align:center;border:1px solid;}
.rpe-main{font-size:32px;font-weight:900;}
.rpe-reps{font-size:13px;margin-top:3px;opacity:0.85;}
.rpe-pct{font-size:11px;margin-top:5px;opacity:0.7;}
.rpe-note{font-size:11px;margin-top:7px;color:var(--text2);line-height:1.5;}
/* PYRAMID */
.pyr{background:var(--bg3);border-radius:var(--rs);padding:11px;margin-bottom:10px;}
.pyr-title{font-size:10px;color:var(--text2);letter-spacing:1px;margin-bottom:7px;}
.pyr-row{display:grid;grid-template-columns:38px 1fr 60px 72px;gap:5px;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;}
.pyr-row:last-child{border-bottom:none;}
/* HYP */
.hyp{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:10px;}
.hyp-title{font-size:10px;font-weight:700;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;}
.vol-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;margin-bottom:10px;border:1px solid;}
.ex-item{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:11px;margin-bottom:7px;}
.ex-name{font-size:13px;font-weight:600;margin-bottom:2px;}
.ex-detail{font-size:11px;color:var(--text2);line-height:1.4;}
.ex-method{display:inline-block;padding:2px 7px;border-radius:20px;font-size:9px;font-weight:700;margin-top:4px;}
.m-myo{background:rgba(74,222,128,0.15);color:var(--green);}
.m-dc{background:rgba(192,132,252,0.15);color:var(--purple);}
.m-ss{background:rgba(245,166,35,0.15);color:var(--gold);}
.m-drp{background:rgba(255,107,157,0.15);color:#ff6b9d;}
/* NOTE */
.note{background:rgba(233,69,96,0.08);border:1px solid rgba(233,69,96,0.25);border-radius:var(--rs);padding:9px 11px;font-size:11px;color:var(--accent);line-height:1.5;margin-top:8px;}
.ib{background:var(--bg3);border-radius:var(--rs);padding:11px;font-size:11px;color:var(--text2);line-height:1.6;margin-bottom:10px;}
/* TOP SET */
.mv-sel{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.mv-btn{flex:1;min-width:70px;padding:9px 4px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text2);font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;line-height:1.3;}
.ts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.tf label{font-size:9px;color:var(--text2);display:block;text-align:center;margin-bottom:3px;}
.tf input,.tf select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:11px 5px;color:var(--text);font-size:16px;text-align:center;width:100%;font-family:inherit;}
.btn-calc{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:12px;}
.result-box{border-radius:var(--r);padding:14px;text-align:center;border:1px solid;margin-bottom:12px;}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.hist-row:last-child{border-bottom:none;}
.badge-up{background:rgba(74,222,128,0.15);color:var(--green);padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-dn{background:rgba(248,113,113,0.15);color:var(--red);padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.btn-del{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:2px 5px;}
.chart-wrap{width:100%;height:160px;position:relative;margin:8px 0;}
/* CYCLE */
.phase-big{border-radius:var(--r);padding:14px;margin-bottom:10px;border:1px solid;}
.bar-row{margin-top:7px;}
.bar-h{display:flex;justify-content:space-between;font-size:10px;opacity:0.7;margin-bottom:3px;}
.bar-t{height:4px;border-radius:2px;background:rgba(255,255,255,0.1);}
.bar-f{height:100%;border-radius:2px;}
.sig{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
.sig:last-child{border-bottom:none;}
/* FORME */
.fc{background:var(--bg2);border-radius:var(--r);overflow:hidden;margin-bottom:10px;border:1px solid;}
.fh{padding:12px;display:flex;align-items:center;gap:10px;}
.fb2{padding:12px;}
.fr{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);}
.fr:last-child{border-bottom:none;}
.fk{font-size:11px;color:var(--text2);}
.fv{font-size:12px;text-align:right;max-width:58%;}
.ft{margin-top:8px;padding:9px;border-radius:var(--rs);font-size:11px;font-style:italic;}
/* PERSO */
.perso-day{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden;}
.perso-hdr{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.perso-body{display:none;padding:0 14px 14px;}
.perso-body.open{display:block;}
.perso-ex-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);}
.perso-ex-row:last-child{border-bottom:none;}
.perso-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:8px 10px;color:var(--text);font-size:13px;font-family:inherit;}
.btn-add-ex{width:100%;padding:9px;background:none;border:1px dashed var(--border);border-radius:var(--rs);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;margin-top:8px;}
.btn-del-ex{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:2px 4px;}
.btn-reset{background:none;border:1px solid rgba(248,113,113,0.3);color:var(--red);border-radius:var(--rs);padding:5px 10px;font-size:10px;cursor:pointer;font-family:inherit;}
/* BACKUP */
.btn-p{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:8px;}
.btn-g{width:100%;padding:13px;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-s{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:7px;}
.rm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:7px;}
.rmf label{font-size:9px;color:var(--text2);display:block;text-align:center;margin-bottom:3px;}
.rmf input{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:9px 5px;color:var(--text);font-size:15px;text-align:center;width:100%;font-family:inherit;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 20px;border-radius:25px;font-size:13px;font-weight:600;opacity:0;transition:opacity 0.25s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="hdr">
  <div><div class="ht">BLOOD &amp; TURBO POWER</div><div class="hs">PUSH PULL · FORCE + HYPERTROPHIE · COMPET. 1ER SEPT.</div></div>
</div>
<nav class="nav">
  <button class="nb active" onclick="SP('prog')" id="nav-prog"><span class="ni">💪</span><span>Programme</span></button>
  <button class="nb" onclick="SP('topset')" id="nav-topset"><span class="ni">🎯</span><span>Top Set</span></button>
  <button class="nb" onclick="SP('cycle')" id="nav-cycle"><span class="ni">📅</span><span>Cycle</span></button>
  <button class="nb" onclick="SP('forme')" id="nav-forme"><span class="ni">⚡</span><span>Forme</span></button>
  <button class="nb" onclick="SP('perso')" id="nav-perso"><span class="ni">✏️</span><span>Mon Prog</span></button>
</nav>
<div class="pg active" id="pg-prog"></div>
<div class="pg" id="pg-topset"></div>
<div class="pg" id="pg-cycle"></div>
<div class="pg" id="pg-forme"></div>
<div class="pg" id="pg-perso"></div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
// ── STATE ──
var RM = JSON.parse(localStorage.getItem('btp_rm2') || 'null') || {bench:101, squat:105, sdt:145, ohp:60};
var TS = JSON.parse(localStorage.getItem('btp_ts2') || '[]');
var curMv = 'sdt';
var perfChart = null;
var cd = 0; // current day
var cw = 1;  // current week 1-5
var persoOpen = {};

function svRM() { localStorage.setItem('btp_rm2', JSON.stringify(RM)); }
function svTS() { localStorage.setItem('btp_ts2', JSON.stringify(TS)); }
function loadCD() { try { var r = localStorage.getItem('btp_cd2'); if (r) { var p = JSON.parse(r); cd = p.cd||0; cw = p.cw||1; } } catch(e) {} }
function svCD() { localStorage.setItem('btp_cd2', JSON.stringify({cd:cd, cw:cw})); }

// ── WEEK CONFIG ──
// 5 semaines par microcycle
// A = lourd 1-3 reps, B = volume 5-7 reps
var WEEKS = [
  null,
  { // S1
    A: { rpe: 8,   reps: "2-3", pct: 85, label: "ACCUMULATION" },
    B: { rpe: 7,   reps: "6-7", pct: 72, label: "ACCUMULATION" }
  },
  { // S2
    A: { rpe: 8.5, reps: "2-3", pct: 88, label: "INTENSIFICATION" },
    B: { rpe: 7.5, reps: "5-6", pct: 76, label: "INTENSIFICATION" }
  },
  { // S3
    A: { rpe: 9,   reps: "1-3", pct: 91, label: "INTENSIFICATION" },
    B: { rpe: 8,   reps: "5-6", pct: 80, label: "INTENSIFICATION" }
  },
  { // S4 — pic
    A: { rpe: 9.5, reps: "1-2", pct: 95, label: "PIC" },
    B: { rpe: 8.5, reps: "4-5", pct: 84, label: "PIC" }
  },
  { // S5 — deload
    A: { rpe: 6,   reps: "3-4", pct: 60, label: "DELOAD" },
    B: { rpe: 6,   reps: "4-5", pct: 60, label: "DELOAD" }
  }
];

var WEEK_COLORS = { "ACCUMULATION":"#4ade80", "INTENSIFICATION":"#fb923c", "PIC":"#f87171", "DELOAD":"#c084fc" };

// ── RPE -> % 1RM conversion ──
var RPE_FACTOR = {10:1, 9.5:1.022, 9:1.044, 8.5:1.067, 8:1.091, 7.5:1.116, 7:1.143, 6.5:1.171, 6:1.2, 5:1.25};

function calc1RM(charge, reps, rpe) {
  var epley = charge * (1 + reps / 30);
  var f = RPE_FACTOR[parseFloat(rpe)] || 1;
  return Math.round(epley * f);
}

function kgFromPct(rm, pct) { return Math.round(rm * pct / 100 / 2.5) * 2.5; }
function rnd2(v) { return Math.round(v * 10) / 10; }

// ── PYRAMID ──
function getPyramid(rm, pct, rpe, reps, isDeload) {
  if (!rm) return null;
  var topKg = kgFromPct(rm, pct);
  if (isDeload) {
    return [
      [45, "5", "Echauff."],
      [55, "3", "Echauff."],
      [null, reps + " @ RPE " + rpe, "TOP SET"]
    ];
  }
  if (pct >= 90) {
    return [
      [50, "3", "Echauff."],
      [60, "2", "Echauff."],
      [70, "1", "Echauff."],
      [80, "1", "Approche"],
      [87, "1", "Approche"],
      [93, "1", "Approche"],
      [null, reps + " @ RPE " + rpe, "TOP SET"]
    ];
  } else if (pct >= 80) {
    return [
      [45, "5", "Echauff."],
      [55, "3", "Echauff."],
      [65, "2", "Echauff."],
      [75, "1", "Approche"],
      [82, "1", "Approche"],
      [null, reps + " @ RPE " + rpe, "TOP SET"]
    ];
  } else {
    return [
      [40, "8", "Echauff."],
      [50, "5", "Echauff."],
      [60, "3", "Echauff."],
      [68, "2", "Approche"],
      [null, reps + " @ RPE " + rpe, "TOP SET"]
    ];
  }
}

// ── DAYS ──
var DAYS = [
  {
    id: 0, short: "PUSH A", label: "PUSH A", type: "A",
    accent: "#e94560",
    forces: [
      { mv: "SQUAT BARRE HAUTE", rm: "squat", note: "Barre haute sur trapezes. Profondeur competition. Cage securite reglee." },
      { mv: "BENCH BARRE", rm: "bench", note: "Prise competition. Pieds au sol. Toucher poitrine obligatoire." }
    ],
    hyp: {
      title: "QUAD + PEC",
      exs: [
        { n: "Presse inclinee + Mollets presse", d: "2 series . 8-10 / 15-20 reps . Superset", m: "SS" },
        { n: "Leg extension machine", d: "2 series . 12-15 reps . Pause 1s contraction", m: null },
        { n: "Adducteurs machine", d: "2 series . 15-20 reps . En finition", m: null },
      ]
    }
  },
  {
    id: 1, short: "PUSH B", label: "PUSH B", type: "B",
    accent: "#f5a623",
    forces: [
      { mv: "SQUAT BARRE HAUTE", rm: "squat", note: "Technique et placement. Descente lente 3s. Profondeur parfaite." },
      { mv: "BENCH BARRE POSE", rm: "bench", note: "Prise competition. Tempo controle. Pause 1s poitrine sur les dernieres series." }
    ],
    hyp: {
      title: "PEC HAUT + EPAULES + TRICEPS",
      exs: [
        { n: "Dev. halteres incline", d: "2 series . 8-10 reps . Amplitude complete", m: null },
        { n: "Elev. lat. assis halteres", d: "2 series . 15-20 reps . Buste sur banc incline", m: null },
        { n: "Magic triceps EZ", d: "2 series . 8-10 reps . Long chef triceps", m: null },
      ]
    }
  },
  {
    id: 2, short: "PULL A", label: "PULL A", type: "A",
    accent: "#00b4d8",
    forces: [
      { mv: "SOULE DE TERRE (SDT)", rm: "sdt", note: "Barre conventionnelle. Dos neutre. Sangles. RER 1 — jamais a l'echec." }
    ],
    hyp: {
      title: "DOS + BICEPS",
      exs: [
        { n: "Tirage vertical poulie haute unilateral", d: "2 series . 8-10 reps/bras . Sangles", m: "DRP" },
        { n: "Rowing Hammer focus trapezes", d: "2 series . 8-10 reps . Dos plat", m: null },
        { n: "Pull-over poulie", d: "2 series . 12-15 reps . Tension constante", m: null },
        { n: "Curl incline halteres", d: "2 series . 8-10 reps . Double Contraction", m: "DC" },
        { n: "Curl pupitre", d: "2 series . 8-10 reps . Isolation stricte", m: null },
      ]
    }
  },
  {
    id: 3, short: "PULL B", label: "PULL B", type: "B",
    accent: "#7bed9f",
    forces: [
      { mv: "SDT ROUMAIN / JAMBES TENDUES", rm: "sdt", note: "Charge plus legere. Amplitude ischio maximale. Jambes quasi verrouilees. RER 1.", pctMod: 0.75 }
    ],
    hyp: {
      title: "ISCHIO + DOS + COU + BICEPS",
      exs: [
        { n: "Leg curl assis machine", d: "2 series . 10-12 reps . Excentrique 3s", m: null },
        { n: "Oiseau halteres buste penche", d: "2 series . 12-15 reps . Pause 1s etirement", m: "MYO" },
        { n: "Tractions prise neutre", d: "2 series . 6-10 reps", m: null },
        { n: "Flexion / extension cou harnais", d: "2 series chaque sens . Charge legere", m: null },
        { n: "Shrug barre", d: "2 series . 10-12 reps . Pause 1s en haut", m: null },
        { n: "Curl halteres marteau", d: "2 series . 10-12 reps", m: null },
      ]
    }
  }
];

// ── UTILS ──
function toast(m) {
  var t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2200);
}
function today() { return new Date().toISOString().split('T')[0]; }
function fd(s) { return new Date(s + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); }

function SP(p) {
  document.querySelectorAll('.pg').forEach(function(x) { x.classList.remove('active'); });
  document.querySelectorAll('.nb').forEach(function(x) { x.classList.remove('active'); });
  document.getElementById('pg-' + p).classList.add('active');
  document.getElementById('nav-' + p).classList.add('active');
  if (p === 'prog') renderProg();
  if (p === 'topset') renderTS();
  if (p === 'cycle') renderCycle();
  if (p === 'forme') renderForme();
  if (p === 'perso') renderPerso();
}

function selDay(i) { cd = i; svCD(); renderProg(); }

// ── EFFECTIVE DAYS (with custom exercises) ──
function getCustomDays() {
  try { var r = localStorage.getItem('btp_custom2'); return r ? JSON.parse(r) : {}; } catch(e) { return {}; }
}
function saveCustomDays(d) { localStorage.setItem('btp_custom2', JSON.stringify(d)); }

function getEffDay(di) {
  var custom = getCustomDays();
  if (!custom[di]) return DAYS[di];
  var day = JSON.parse(JSON.stringify(DAYS[di]));
  day.hyp.exs = custom[di];
  return day;
}

// ── PROGRAMME ──
function renderProg() {
  var el = document.getElementById('pg-prog');
  var day = getEffDay(cd);
  var wk = WEEKS[cw];
  var wconf = wk[day.type]; // A or B config
  var pc = WEEK_COLORS[wconf.label] || '#4ade80';
  var isDeload = wconf.label === 'DELOAD';
  var vl = isDeload ? 'SUPPRIME' : (cw >= 4 ? 'MINIMAL' : cw >= 2 ? 'REDUIT' : 'PLEIN');
  var vlC = {'PLEIN':'#4ade80','REDUIT':'#facc15','MINIMAL':'#fb923c','SUPPRIME':'#c084fc'}[vl];

  var html = '';

  // Day selector
  html += '<div class="days">'
    + DAYS.map(function(d, i) {
        return '<button class="db" onclick="selDay(' + i + ')" style="'
          + (i===cd ? 'background:'+d.accent+';border-color:'+d.accent+';color:#000' : '') + '">'
          + d.short + '</button>';
      }).join('')
    + '</div>';

  // Week slider
  html += '<div class="week-wrap">'
    + '<div class="week-row"><span class="week-label">Semaine du cycle</span>'
    + '<span class="week-val" style="color:' + pc + '">S' + cw + ' — ' + wconf.label + '</span></div>'
    + '<input type="range" min="1" max="5" value="' + cw + '" oninput="cw=parseInt(this.value);svCD();renderProg()" style="width:100%;accent-color:' + pc + '"/>'
    + '<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text2);margin-top:3px">'
    + '<span>S1 Accum.</span><span>S2</span><span>S3</span><span>S4 Pic</span><span>S5 Deload</span>'
    + '</div></div>';

  // Phase banner
  html += '<div class="phase-banner" style="background:' + pc + '15;border-color:' + pc + '40">'
    + '<div class="phase-badge" style="background:' + pc + '">'
    + '<span class="phase-badge-s">S' + cw + '</span>'
    + '<span class="phase-badge-rpe">R' + wconf.rpe + '</span>'
    + '</div>'
    + '<div>'
    + '<div style="font-weight:700;font-size:13px;color:' + pc + '">' + wconf.label + ' — ' + day.label + '</div>'
    + '<div style="font-size:11px;color:' + pc + ';opacity:0.8;margin-top:2px">'
    + 'RPE ' + wconf.rpe + ' · ' + wconf.reps + ' reps · ~' + wconf.pct + '% 1RM'
    + '</div></div></div>';

  // FORCE BLOCKS
  day.forces.forEach(function(force, fi) {
    var rm = force.rm ? RM[force.rm] : null;
    var pctUse = force.pctMod ? Math.round(wconf.pct * force.pctMod) : wconf.pct;
    var topKg = rm ? kgFromPct(rm, pctUse) : null;
    var pyr = getPyramid(rm, pctUse, wconf.rpe, wconf.reps, isDeload);

    html += '<div class="force-block" style="background:linear-gradient(135deg,#1a0810,var(--bg));border-color:' + day.accent + '">'
      + '<div class="force-tag" style="color:' + day.accent + '">BLOC FORCE ' + (day.forces.length > 1 ? (fi+1) : '') + '</div>'
      + '<div class="force-mv">' + force.mv + '</div>'
      + '<div class="force-type" style="color:' + day.accent + '">' + day.type === 'A' ? 'LOURD — 1-3 reps' : 'VOLUME/TECHNIQUE — 5-7 reps' + '</div>';

    if (isDeload) {
      html += '<div class="ib">Deload — charges legeres, technique uniquement. RPE 6 max.</div>';
    } else {
      // RPE Box
      html += '<div class="rpe-box" style="background:' + pc + '12;border-color:' + pc + '40">'
        + '<div class="rpe-main" style="color:' + pc + '">RPE ' + wconf.rpe + '</div>'
        + '<div class="rpe-reps" style="color:' + pc + '">' + wconf.reps + ' repetitions</div>'
        + '<div class="rpe-pct" style="color:' + pc + '">~' + pctUse + '% 1RM'
        + (topKg ? ' · environ ' + topKg + ' kg' : '') + '</div>'
        + '<div class="rpe-note">Monte par paliers. Stop des que le RPE est atteint.</div>'
        + '</div>';

      // Pyramid
      if (pyr) {
        html += '<div class="pyr"><div class="pyr-title">PYRAMIDE' + (rm ? ' — BASE ' + rm + ' kg' : '') + '</div>'
          + pyr.map(function(row) {
              var p = row[0], r = row[1], t = row[2];
              var col = t === 'TOP SET' ? pc : t === 'Approche' ? 'var(--gold)' : 'var(--text2)';
              var kg = (p && rm) ? kgFromPct(rm, p) + ' kg' : (t === 'TOP SET' ? '~' + (topKg||'?') + ' kg' : '');
              return '<div class="pyr-row">'
                + '<span style="font-weight:700;color:' + col + '">' + (p ? p + '%' : '↑') + '</span>'
                + '<span style="font-size:12px">' + kg + '</span>'
                + '<span style="font-size:11px;color:var(--text2)">' + r + '</span>'
                + '<span style="font-size:10px;text-align:right;color:' + col + '">' + t + '</span>'
                + '</div>';
            }).join('')
          + '</div>';
      }
    }

    html += '<div class="note">⚠ ' + force.note + '</div></div>';
  });

  // HYP BLOCK
  var mc = { MYO: 'm-myo', DC: 'm-dc', SS: 'm-ss', DRP: 'm-drp' };
  html += '<div class="hyp">'
    + '<div class="hyp-title">' + day.hyp.title + '</div>'
    + '<span class="vol-badge" style="background:' + vlC + '20;color:' + vlC + ';border-color:' + vlC + '40">VOLUME ' + vl + '</span>';

  if (isDeload) {
    html += '<div class="ib">Hypertrophie supprimee cette semaine.</div>';
  } else {
    day.hyp.exs.forEach(function(ex) {
      var sup = vl === 'SUPPRIME';
      var sets = vl === 'PLEIN' ? '2s' : vl === 'REDUIT' ? '2s' : '1s';
      html += '<div class="ex-item"' + (sup ? ' style="opacity:0.3"' : '') + '>'
        + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'
        + '<div class="ex-name">' + ex.n + '</div>'
        + '<div style="display:flex;align-items:center;gap:5px">'
        + (ex.m && !sup ? '<span class="ex-method ' + (mc[ex.m]||'') + '">' + ex.m + '</span>' : '')
        + '<span style="font-size:12px;font-weight:700;color:' + (sup?'var(--text2)':'var(--green)') + '">' + (sup?'OFF':sets) + '</span>'
        + '</div></div>'
        + (!sup ? '<div class="ex-detail">' + ex.d + '</div>' : '')
        + '</div>';
    });
  }
  html += '</div>';

  // RM update block
  html += '<div style="background:var(--bg3);border-radius:var(--rs);padding:11px;margin-top:10px">'
    + '<div style="font-size:10px;color:var(--text2);letter-spacing:1px;margin-bottom:2px">METTRE A JOUR MES 1RM</div>'
    + '<div style="font-size:10px;color:var(--text2);opacity:0.7;margin-bottom:8px">La pyramide se recalcule automatiquement</div>'
    + '<div class="rm-grid">'
    + '<div class="rmf"><label>BENCH</label><input type="number" inputmode="decimal" id="rm-b" placeholder="' + RM.bench + '"/></div>'
    + '<div class="rmf"><label>SQUAT</label><input type="number" inputmode="decimal" id="rm-s" placeholder="' + RM.squat + '"/></div>'
    + '<div class="rmf"><label>SDT</label><input type="number" inputmode="decimal" id="rm-d" placeholder="' + RM.sdt + '"/></div>'
    + '<div class="rmf"><label>MILITAIRE</label><input type="number" inputmode="decimal" id="rm-o" placeholder="' + RM.ohp + '"/></div>'
    + '</div>'
    + '<button class="btn-s" onclick="updRM()">Mettre a jour</button>'
    + '</div>';

  el.innerHTML = html;
}

function updRM() {
  var f = function(id, def) { return parseFloat(document.getElementById(id).value) || def; };
  RM.bench = f('rm-b', RM.bench);
  RM.squat = f('rm-s', RM.squat);
  RM.sdt = f('rm-d', RM.sdt);
  RM.ohp = f('rm-o', RM.ohp);
  svRM(); toast('1RM mis a jour'); renderProg();
}

// ── TOP SET ──
var MV_LABELS = { bench: 'BENCH', squat: 'SQUAT', sdt: 'SDT', ohp: 'MILITAIRE' };
var MV_COLORS = { bench: '#f5a623', squat: '#7bed9f', sdt: '#00b4d8', ohp: '#e94560' };

function renderTS() {
  var el = document.getElementById('pg-topset');
  var hist = TS.filter(function(t) { return t.mv === curMv; }).sort(function(a, b) { return a.date.localeCompare(b.date); });
  var c = MV_COLORS[curMv];

  var html = '<div class="card">'
    + '<div class="ct">Enregistrer un top set</div>'
    + '<div class="mv-sel">'
    + Object.keys(MV_LABELS).map(function(mv) {
        return '<button class="mv-btn" onclick="selMV(\'' + mv + '\')" style="'
          + (mv === curMv ? 'background:' + MV_COLORS[mv] + ';border-color:' + MV_COLORS[mv] + ';color:#000' : '') + '">'
          + MV_LABELS[mv] + '</button>';
      }).join('')
    + '</div>'
    + '<div class="ts-grid">'
    + '<div class="tf"><label>CHARGE (kg)</label><input type="number" inputmode="decimal" step="0.5" id="ts-c" placeholder="---"/></div>'

    + '<div class="tf"><label>RPE</label><select id="ts-rpe"><option value="">—</option>'

    + '</select></div></div>'
    + '<button class="btn-calc" onclick="calcTS()">Calculer et sauvegarder</button>'
    + '<div id="ts-result"></div></div>'

    // 1RM summary
    + '<div class="card"><div class="ct">1RM estimes</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">'
    + Object.keys(MV_LABELS).map(function(mv) {
        return '<div style="text-align:center;background:var(--bg3);border-radius:var(--rs);padding:10px">'
          + '<div style="font-size:9px;color:var(--text2);margin-bottom:3px">' + MV_LABELS[mv] + '</div>'
          + '<div style="font-size:18px;font-weight:700;color:' + MV_COLORS[mv] + '">' + RM[mv] + ' kg</div></div>';
      }).join('')

  // Chart
  if (hist.length > 1) {
    html += '<div class="card"><div class="ct">Courbe 1RM — ' + MV_LABELS[curMv] + '</div>'
      + '<div class="chart-wrap"><canvas id="pc"></canvas></div>'
      + '<div style="display:flex;gap:10px;font-size:10px;flex-wrap:wrap;margin-top:6px">'
      + '<span style="color:#4ade80">■ RPE &lt;7.5</span>'
      + '<span style="color:#f5a623">■ RPE 7.5-8.5</span>'
      + '<span style="color:#f87171">■ RPE &gt;8.5</span>'
      + '</div></div>';
  }

  // History
  if (hist.length) {
    html += '<div class="card"><div class="ct">Historique — ' + MV_LABELS[curMv] + '</div>'
      + hist.slice().reverse().map(function(t, i, arr) {
          var prev = arr[i+1];
          var delta = prev ? t.rm1 - prev.rm1 : null;
          return '<div class="hist-row">'
            + '<div style="flex:1">'
            + '<div style="font-size:11px;color:var(--text2)">' + fd(t.date) + ' · S' + (t.week||'?') + ' du cycle</div>'
            + '<div style="font-size:13px">' + t.charge + 'kg × ' + t.reps + ' @ RPE ' + t.rpe + '</div>'
            + (delta !== null ? '<span class="' + (delta>0?'badge-up':'badge-dn') + '">' + (delta>0?'+':'') + delta + ' kg</span>' : '')
            + '</div>'
            + '<div style="text-align:right;display:flex;align-items:center;gap:8px">'
            + '<div>'
            + '<div style="font-size:17px;font-weight:700;color:' + c + '">' + t.rm1 + ' kg</div>'
            + '<div style="font-size:10px;color:var(--text2)">1RM estime</div>'
            + '</div>'
            + '<button class="btn-del" onclick="delTS(' + t.id + ')">🗑</button>'
            + '</div></div>';
        }).join('')
      + '</div>';
  } else {
    html += '<div style="text-align:center;padding:24px;color:var(--text2);font-size:13px">Aucun top set enregistre.</div>';
  }

  el.innerHTML = html;

  if (hist.length > 1) {
    setTimeout(function() {
      var ctx = document.getElementById('pc');
      if (!ctx) return;
      if (perfChart) { perfChart.destroy(); perfChart = null; }
      var colors = hist.map(function(t) {
        var r = parseFloat(t.rpe);
        return r < 7.5 ? '#4ade80' : r <= 8.5 ? '#f5a623' : '#f87171';
      });
      perfChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: hist.map(function(e) { return fd(e.date); }),
          datasets: [{
            data: hist.map(function(e) { return e.rm1; }),
            borderColor: c, backgroundColor: 'rgba(0,0,0,0)',
            pointBackgroundColor: colors, pointBorderColor: colors,
            pointRadius: 6, tension: 0.3, borderWidth: 2
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { callbacks: {
            label: function(ctx) { return ctx.parsed.y + ' kg'; },
            afterLabel: function(ctx) { var t = hist[ctx.dataIndex]; return t.charge + 'kg x' + t.reps + ' @ RPE' + t.rpe; }
          }}},
          scales: {
            x: { ticks: { font: { size: 10 }, maxRotation: 40 }, grid: { display: false } },
            y: { ticks: { font: { size: 11 } }, grid: { color: 'rgba(128,128,128,0.1)' } }
          }
        }
      });
    }, 100);
  }
}

function selMV(mv) { curMv = mv; renderTS(); }

function calcTS() {
  var c = parseFloat(document.getElementById('ts-c').value);
  var r = parseFloat(document.getElementById('ts-r').value);
  var rpe = document.getElementById('ts-rpe').value;
  if (!c || !r || !rpe) { toast('Remplis charge, reps et RPE'); return; }
  var est = calc1RM(c, r, parseFloat(rpe));
  var prev = RM[curMv];
  var delta = est - prev;
  RM[curMv] = est;
  svRM();
  TS.push({ mv: curMv, date: today(), charge: c, reps: r, rpe: parseFloat(rpe), rm1: est, id: Date.now(), week: cw });
  svTS();
  var col = MV_COLORS[curMv];
  document.getElementById('ts-result').innerHTML = '<div class="result-box" style="background:' + col + '12;border-color:' + col + '40">'
    + '<div style="font-size:10px;color:' + col + ';letter-spacing:1px;margin-bottom:4px">1RM ESTIME — ' + MV_LABELS[curMv] + '</div>'
    + '<div style="font-size:36px;font-weight:900;color:' + col + '">' + est + ' <span style="font-size:13px;font-weight:400">kg</span></div>'
    + (delta !== 0 ? '<div style="font-size:13px;font-weight:600;color:' + (delta>0?'var(--green)':'var(--red)') + ';margin-top:4px">' + (delta>0?'+':'') + delta + ' kg vs precedent</div>' : '')
    + '<div style="font-size:11px;margin-top:6px;color:var(--text2)">Pyramide mise a jour automatiquement</div>'
    + '</div>';
  toast('1RM mis a jour : ' + est + ' kg');
  renderTS();
}

function delTS(id) {
  if (!confirm('Supprimer ?')) return;
  TS = TS.filter(function(t) { return t.id !== id; });
  // Recalc all RMs
  ['bench','squat','sdt','ohp'].forEach(function(mv) {
    var entries = TS.filter(function(t) { return t.mv === mv; }).sort(function(a,b) { return b.date.localeCompare(a.date); });
    if (entries.length) RM[mv] = entries[0].rm1;
    else { var def = {bench:101,squat:105,sdt:145,ohp:60}; RM[mv] = def[mv]; }
  });
  svTS(); svRM();
  toast('Supprime');
  renderTS();
}

    + '</div>'
    + formes.map(function(f) {
        return '<div class="fc" style="border-color:' + f.c + '40">'
          + '<div class="fh" style="background:' + f.c + '18">'
          + '<span style="font-size:26px">' + f.e + '</span>'
          + '<div><div style="font-weight:900;color:' + f.c + ';font-size:15px">' + f.p + '</div>'
          + '<div style="font-size:10px;color:' + f.c + ';letter-spacing:1px;opacity:0.8">' + f.l + '</div></div></div>'
          + '<div class="fb2">'
          + f.rows.map(function(r) {
              return '<div class="fr"><span class="fk">' + r[0] + '</span><span class="fv">' + r[1] + '</span></div>';
            }).join('')
          + '<div class="ft" style="background:' + f.c + '12;color:' + f.c + '">"' + f.tip + '"</div>'
          + '</div></div>';
      }).join('');

  el.innerHTML = html;
}

// ── PERSO ──
function renderPerso() {
  var el = document.getElementById('pg-perso');
  var custom = getCustomDays();

  var html = '<div class="ib">Personnalise tes exercices par seance. Les modifications s\'appliquent sur cet appareil uniquement.</div>'
    + DAYS.map(function(day, di) {
        var exs = custom[di] ? custom[di] : day.hyp.exs;
        var isOpen = persoOpen[di];
        return '<div class="perso-day">'
          + '<div class="perso-hdr" onclick="togglePerso(' + di + ')" style="border-left:3px solid ' + day.accent + '">'
          + '<div style="font-size:14px;font-weight:700;color:' + day.accent + '">' + day.label + '</div>'
          + '<div style="display:flex;align-items:center;gap:8px">'
          + '<button class="btn-reset" onclick="event.stopPropagation();resetPersoDay(' + di + ')">Reinit.</button>'
          + '<span style="font-size:16px;color:var(--text2)">' + (isOpen ? '▲' : '▼') + '</span>'
          + '</div></div>'
          + '<div class="perso-body' + (isOpen ? ' open' : '') + '" id="pb-' + di + '">'
          + exs.map(function(ex, ei) {
              var name = typeof ex === 'string' ? ex : ex.n;
              return '<div class="perso-ex-row">'
                + '<input class="perso-input" type="text" value="' + name + '" onchange="updatePersoEx(' + di + ',' + ei + ',this.value)"/>'
                + '<button class="btn-del-ex" onclick="delPersoEx(' + di + ',' + ei + ')">✕</button>'
                + '</div>';
            }).join('')
          + '<button class="btn-add-ex" onclick="addPersoEx(' + di + ')">+ Ajouter un exercice</button>'
          + '</div></div>';
      }).join('')

    + '<div class="card"><div class="ct">Sauvegarde</div>'
    + '<div class="ib">Exporte tes donnees pour ne pas les perdre.</div>'
    + '<button class="btn-p" onclick="exportData()">Exporter mes donnees</button>'
    + '<button class="btn-g" onclick="importData()">Importer une sauvegarde</button>'
    + '</div>';

  el.innerHTML = html;
}

function togglePerso(di) {
  persoOpen[di] = !persoOpen[di];
  renderPerso();
}

function getCustomExs(di) {
  var custom = getCustomDays();
  if (custom[di]) return custom[di];
  return DAYS[di].hyp.exs.map(function(ex) { return { n: ex.n, d: ex.d || '', m: ex.m || null }; });
}

function saveCustomExs(di, exs) {
  var custom = getCustomDays();
  custom[di] = exs;
  saveCustomDays(custom);
}

function updatePersoEx(di, ei, val) {
  var exs = getCustomExs(di);
  if (exs[ei]) exs[ei] = { n: val, d: exs[ei].d || '', m: exs[ei].m || null };
  saveCustomExs(di, exs);
}

function delPersoEx(di, ei) {
  var exs = getCustomExs(di);
  exs.splice(ei, 1);
  saveCustomExs(di, exs);
  toast('Supprime');
  renderPerso();
}

function addPersoEx(di) {
  var exs = getCustomExs(di);
  exs.push({ n: 'Nouvel exercice', d: '', m: null });
  saveCustomExs(di, exs);
  persoOpen[di] = true;
  renderPerso();
}

function resetPersoDay(di) {
  if (!confirm('Reinitialiser ' + DAYS[di].label + ' ?')) return;
  var custom = getCustomDays();
  delete custom[di];
  saveCustomDays(custom);
  toast('Reinitialise');
  renderPerso();
}

function exportData() {
  var data = JSON.stringify({ rm: RM, ts: TS, custom: getCustomDays(), cd: cd, cw: cw }, null, 2);
  var blob = new Blob([data], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'bt_power_' + today() + '.json';
  a.click(); URL.revokeObjectURL(url);
  toast('Exporte');
}

function importData() {
  var input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = function(e) {
    var file = e.target.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var p = JSON.parse(ev.target.result);
        if (!confirm('Restaurer ?')) return;
        if (p.rm) RM = p.rm;
        if (p.ts) TS = p.ts;
        if (p.custom) saveCustomDays(p.custom);
        if (p.cd !== undefined) cd = p.cd;
        if (p.cw !== undefined) cw = p.cw;
        svRM(); svTS(); svCD();
        toast('Restaure'); SP('prog');
      } catch(e) { toast('Erreur'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ── INIT ──
loadCD();
renderProg();
renderCycle();
renderForme();
renderPerso();
</script>
</body>
</html>
